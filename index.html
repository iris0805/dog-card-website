<!DOCTYPE html>
<html lang="zh-TW">

    <!-- 引入 Tailwind CSS 確保極致的行動端適配與深色高對比主題 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 800: '#1e293b', 900: '#0f172a' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' },
                        warmOrange: '#ea580c'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0f172a; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-slate-900 text-slate-200">

    <!-- 頂部導航列 -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🐾</span>
                    <h1 class="text-xl sm:text-2xl font-bold text-amber-400">狗狗百科圖鑑</h1>
                </div>
                <!-- 模式切換按鈕 -->
                <div class="flex bg-slate-800 rounded-full p-1 border border-slate-700">
                    <button onclick="app.switchTab('encyclopedia')" id="tab-encyclopedia" class="touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors bg-amber-500 text-slate-900">
                        📚 圖鑑
                    </button>
                    <button onclick="app.switchTab('quiz')" id="tab-quiz" class="touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors text-slate-400 hover:text-amber-400">
                        🎯 飼主測驗
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- 視圖 1：圖鑑模式 -->
        <section id="view-encyclopedia" class="block">
            <!-- 搜尋與快篩區塊 -->
            <div class="mb-8 space-y-4">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="app.filterDogs()" placeholder="搜尋犬種 (支援中英文)..." 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors touch-target shadow-inner text-white placeholder-slate-400">
                </div>
                
                <div class="flex flex-wrap gap-2" id="filter-container">
                    <button onclick="app.setFilter('all')" class="filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-amber-500 text-slate-900 transition-colors" data-filter="all">【全部顯示】</button>
                    <button onclick="app.setFilter('small')" class="filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 transition-colors" data-filter="small">🐾 小型犬</button>
                    <button onclick="app.setFilter('medium')" class="filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 transition-colors" data-filter="medium">🐕 中型犬</button>
                    <button onclick="app.setFilter('large')" class="filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 transition-colors" data-filter="large">🦮 大型犬</button>
                </div>
            </div>

            <!-- 犬種卡片網格 -->
            <div id="dog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- 由 JS 動態渲染 -->
            </div>
            
            <div id="no-results" class="hidden text-center py-12">
                <p class="text-4xl mb-4">😿</p>
                <p class="text-slate-400 text-lg">找不到符合條件的狗狗</p>
            </div>
        </section>

        <!-- 視圖 2：飼主適配度測驗 -->
        <section id="view-quiz" class="hidden">
            <div class="max-w-2xl mx-auto bg-slate-800 rounded-2xl p-6 sm:p-8 border border-slate-700 shadow-xl">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-amber-400 mb-2">天選之汪配對測驗 💖</h2>
                    <p class="text-slate-400">回答 3 個生活情境問題，為您推薦最適合的毛小孩！</p>
                </div>

                <div class="space-y-8" id="quiz-questions">
                    <!-- Q1 -->
                    <div class="quiz-q" data-step="1">
                        <p class="text-lg font-semibold mb-4">1. 您的居家空間大約是？🏠</p>
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="app.selectQuizAns(1, 1)" class="quiz-ans-1 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">小公寓 / 套房 (無前庭後院)</button>
                            <button onclick="app.selectQuizAns(1, 2)" class="quiz-ans-1 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">一般住宅 / 大樓 (空間適中)</button>
                            <button onclick="app.selectQuizAns(1, 3)" class="quiz-ans-1 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">透天厝 / 附有庭院的大空間</button>
                        </div>
                    </div>
                    <!-- Q2 -->
                    <div class="quiz-q" data-step="2">
                        <p class="text-lg font-semibold mb-4">2. 您每天能專門帶狗散步放電的時間？⏱️</p>
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="app.selectQuizAns(2, 2)" class="quiz-ans-2 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">少於 30 分鐘 (平常較忙碌)</button>

                            <button onclick="app.selectQuizAns(2, 5)" class="quiz-ans-2 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">1 小時以上 (熱愛戶外活動)</button>
                        </div>
                    </div>
                    <!-- Q3 -->
                    <div class="quiz-q" data-step="3">
                        <p class="text-lg font-semibold mb-4">3. 對於「掉毛」的容忍度？🧹</p>
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="app.selectQuizAns(3, 1)" class="quiz-ans-3 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">絕不妥協 (有鼻子過敏或潔癖)</button>
                            <button onclick="app.selectQuizAns(3, 3)" class="quiz-ans-3 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">普通 (定期梳理打掃即可接受)</button>
                            <button onclick="app.selectQuizAns(3, 5)" class="quiz-ans-3 touch-target p-4 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-slate-700 text-left transition-colors">毫不在乎 (家裡有狗毛是愛的證明)</button>
                        </div>
                    </div>
                </div>

                    <button onclick="app.submitQuiz()" id="submit-quiz-btn" disabled class="touch-target w-full sm:w-auto px-8 py-3 rounded-xl font-bold text-lg bg-amber-500 text-slate-900 disabled:bg-slate-600 disabled:text-slate-400 disabled:cursor-not-allowed transition-colors">

                </div>
            </div>

            </div>
        </section>

            </div>

                <!-- 動態注入詳細資訊 -->
            </div>

            let quizAnswers = { 1: 0, 2: 0, 3: 0 };
            let audioCtx = null;

            const gridEl = document.getElementById('dog-grid');
            const noResultsEl = document.getElementById('no-results');
            const searchInput = document.getElementById('searchInput');
            const modalEl = document.getElementById('dog-modal');
            const modalContent = document.getElementById('modal-content');
            const filterContainer = document.getElementById('filter-container');

            function generateStatBars(value, colorClass = 'bg-amber-500') {
                let html = '<div class="flex gap-1 h-3 mt-1">';
                for (let i = 1; i <= 5; i++) {
                    let fill = i <= value ? colorClass : 'bg-slate-700';
                    let glow = i <= value ? 'shadow-[0_0_8px_rgba(245,158,11,0.5)]' : '';
                    if(colorClass !== 'bg-amber-500') glow = ''; 
                    html += `<div class="flex-1 rounded-sm ${fill} ${glow}"></div>`;
                }
                html += '</div>';
                return html;
            }

            function renderGrid() {
                const filteredDogs = dogDB.filter(dog => {
                    const matchSearch = dog.name.includes(searchQuery) || dog.nameEn.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchFilter = currentFilter === 'all' || 
                                      (currentFilter === 'small' && dog.sizeValue === 1) ||
                                      (currentFilter === 'medium' && dog.sizeValue === 2) ||
                                      (currentFilter === 'large' && dog.sizeValue === 3);
                    return matchSearch && matchFilter;
                });

                gridEl.innerHTML = '';
                
                if (filteredDogs.length === 0) {
                    gridEl.classList.add('hidden');
                    noResultsEl.classList.remove('hidden');
                    return;
                }
                
                gridEl.classList.remove('hidden');
                noResultsEl.classList.add('hidden');

                filteredDogs.forEach(dog => {
                    const card = document.createElement('div');
                    card.className = "card-hover bg-slate-800 rounded-2xl p-5 cursor-pointer border border-slate-700 flex flex-col h-full";
                    card.onclick = () => app.openModal(dog.id);
                    
                    card.innerHTML = `
                        <div class="h-48 w-full relative overflow-hidden rounded-xl -mt-2 mb-4 bg-slate-700">
                            <img src="${dog.image}" alt="${dog.name}" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 right-0 bg-black/60 text-[10px] text-white/80 px-2 py-1 rounded-tl-lg">
                                © ${dog.imageSource}
                            </div>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-xl font-bold text-white tracking-wide">${dog.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">${dog.nameEn}</p>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-700 text-amber-400">${dog.size}</span>
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-700 text-slate-300">${dog.origin}</span>
                        </div>
                        <div class="mt-auto space-y-3">
                            <div>
                                <div class="flex justify-between text-xs text-slate-400"><span>運動能量</span><span>${dog.stats.energy}/5</span></div>
                                ${generateStatBars(dog.stats.energy, 'bg-warmOrange')}
                            </div>
                            <div>
                                <div class="flex justify-between text-xs text-slate-400"><span>友善程度</span><span>${dog.stats.friend}/5</span></div>
                                ${generateStatBars(dog.stats.friend)}
                            </div>
                        </div>
                    `;
                    gridEl.appendChild(card);
                });
            }

            function initAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSyntheticBark(type) {
                initAudio();
                const t = audioCtx.currentTime;
                
                if (type === 'husky') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.linearRampToValueAtTime(500, t + 0.5);
                    osc.frequency.linearRampToValueAtTime(250, t + 1.8);
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.8, t + 0.2);
                    gain.gain.setValueAtTime(0.8, t + 1.2);
                    gain.gain.linearRampToValueAtTime(0, t + 2.0);
                    
                    osc.start(t);
                    osc.stop(t + 2.0);
                    
                } else if (type === 'small') {
                    for (let i = 0; i < 2; i++) {
                        let offset = i * 0.15;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square';
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.frequency.setValueAtTime(800, t + offset);
                        osc.frequency.exponentialRampToValueAtTime(400, t + offset + 0.05);
                        
                        gain.gain.setValueAtTime(0, t + offset);
                        gain.gain.linearRampToValueAtTime(0.3, t + offset + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + offset + 0.1);
                        
                        osc.start(t + offset);
                        osc.stop(t + offset + 0.1);
                    }
                } else {
                    const baseFreq = type === 'large' ? 180 : 350;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.frequency.setValueAtTime(baseFreq, t);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.6, t + 0.15);
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                    
                    osc.start(t);
                    osc.stop(t + 0.2);
                }
            }

            return {
                init: function() { renderGrid(); },
                
                switchTab: function(tabName) {
                    const encyView = document.getElementById('view-encyclopedia');
                    const quizView = document.getElementById('view-quiz');
                    const btnEncy = document.getElementById('tab-encyclopedia');
                    const btnQuiz = document.getElementById('tab-quiz');

                    if (tabName === 'encyclopedia') {
                        encyView.classList.remove('hidden');
                        quizView.classList.add('hidden');
                        btnEncy.className = "touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors bg-amber-500 text-slate-900";
                        btnQuiz.className = "touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors text-slate-400 hover:text-amber-400";
                    } else {
                        encyView.classList.add('hidden');
                        quizView.classList.remove('hidden');
                        btnQuiz.className = "touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors bg-amber-500 text-slate-900";
                        btnEncy.className = "touch-target px-4 py-1.5 rounded-full text-sm sm:text-base font-medium transition-colors text-slate-400 hover:text-amber-400";
                    }
                },

                filterDogs: function() {
                    searchQuery = searchInput.value;
                    renderGrid();
                },

                setFilter: function(size) {
                    currentFilter = size;
                    const btns = filterContainer.querySelectorAll('.filter-btn');
                    btns.forEach(btn => {
                        if (btn.dataset.filter === size) {
                            btn.className = "filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-amber-500 text-slate-900 transition-colors shadow-[0_0_10px_rgba(245,158,11,0.4)]";
                        } else {
                            btn.className = "filter-btn touch-target px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 transition-colors";
                        }
                    });
                    renderGrid();
                },

                openModal: function(dogId) {
                    const dog = dogDB.find(d => d.id === dogId);
                    if(!dog) return;

                    const tagsHtml = dog.traits.tags.map(t => `<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-sm">${t}</span>`).join('');
                    
                    modalContent.innerHTML = `
                        <div class="h-64 w-full relative -mx-6 sm:-mx-8 mb-6 overflow-hidden rounded-t-3xl bg-slate-700">
                             <img src="${dog.image}" alt="${dog.name}" class="w-full h-full object-cover">
                             <div class="absolute bottom-2 right-2 bg-black/60 text-xs text-white px-3 py-1.5 rounded backdrop-blur-sm">
                                Photo by ${dog.imageSource} / Unsplash
                             </div>
                        </div>

                        <div class="flex items-center gap-4 mb-6">
                            <div>
                                <h2 class="text-3xl font-bold text-white">${dog.name}</h2>
                                <p class="text-slate-400">${dog.nameEn} · ${dog.origin}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                            <div><span class="text-slate-400 text-sm block">分類群組</span><span class="font-medium text-amber-400">${dog.group}</span></div>
                            <div><span class="text-slate-400 text-sm block">體型</span><span class="font-medium text-amber-400">${dog.size}</span></div>
                            <div><span class="text-slate-400 text-sm block">耳朵</span><span class="font-medium text-white">${dog.traits.ear}</span></div>
                            <div><span class="text-slate-400 text-sm block">被毛</span><span class="font-medium text-white">${dog.traits.coat}</span></div>
                        </div>

                        <h3 class="font-semibold text-lg text-white border-b border-slate-700 pb-2 mb-4">五維屬性雷達</h3>
                        <div class="space-y-4 mb-6">
                            <div class="flex items-center justify-between"><span class="w-24 text-slate-300 text-sm">⚡ 運動能量</span><div class="w-full ml-4">${generateStatBars(dog.stats.energy, 'bg-warmOrange')}</div></div>
                            <div class="flex items-center justify-between"><span class="w-24 text-slate-300 text-sm">🧹 掉毛程度</span><div class="w-full ml-4">${generateStatBars(dog.stats.shedding, 'bg-amber-500')}</div></div>
                            <div class="flex items-center justify-between"><span class="w-24 text-slate-300 text-sm">💖 友善程度</span><div class="w-full ml-4">${generateStatBars(dog.stats.friend, 'bg-pink-500')}</div></div>
                            <div class="flex items-center justify-between"><span class="w-24 text-slate-300 text-sm">🧠 易訓練度</span><div class="w-full ml-4">${generateStatBars(dog.stats.train, 'bg-blue-400')}</div></div>
                            <div class="flex items-center justify-between"><span class="w-24 text-slate-300 text-sm">📢 吠叫警惕</span><div class="w-full ml-4">${generateStatBars(dog.stats.bark, 'bg-purple-400')}</div></div>
                        </div>

                        <h3 class="font-semibold text-lg text-white border-b border-slate-700 pb-2 mb-4">行為與照護須知</h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${tagsHtml}
                        </div>
                        <p class="text-slate-300 text-sm leading-relaxed mb-2">${dog.care}</p>
                        <p class="text-amber-400 text-sm leading-relaxed font-medium bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">${dog.apt}</p>

                        <div class="mt-8 flex justify-center">
                            <button onclick="app.playBark('${dog.barkType}')" class="touch-target bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(245,158,11,0.4)] transition-all transform hover:scale-105 flex items-center gap-2">
                                <span>🔊 播放模擬叫聲</span>
                            </button>
                        </div>
                    `;

                    modalEl.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                },

                closeModal: function() {
                    modalEl.classList.add('hidden');
                    document.body.style.overflow = '';
                },

                playBark: playSyntheticBark,

                selectQuizAns: function(questionNum, value) {
                    quizAnswers[questionNum] = value;
                    const btns = document.querySelectorAll(`.quiz-ans-${questionNum}`);
                    btns.forEach(btn => {
                        btn.classList.remove('border-amber-400', 'bg-slate-700', 'ring-2', 'ring-amber-500');
                        btn.classList.add('border-slate-600', 'bg-slate-700/50');
                    });
                    event.currentTarget.classList.remove('border-slate-600', 'bg-slate-700/50');
                    event.currentTarget.classList.add('border-amber-400', 'bg-slate-700', 'ring-2', 'ring-amber-500');

                    if(quizAnswers[1] && quizAnswers[2] && quizAnswers[3]) {
                        document.getElementById('submit-quiz-btn').disabled = false;
                    }
                },

                submitQuiz: function() {
                    const uSize = quizAnswers[1];
                    const uEnergy = quizAnswers[2];
                    const uShed = quizAnswers[3];

                    let matches = dogDB.map(dog => {
                        let score = 0;
                        if (dog.sizeValue > uSize) score += (dog.sizeValue - uSize) * 10;
                        score += Math.abs(dog.stats.energy - uEnergy) * 2;
                        let shedDiff = dog.stats.shedding - uShed;
                        if(shedDiff > 0) score += shedDiff * 3; 
                        return { ...dog, matchScore: score };
                    });

                    matches.sort((a, b) => a.matchScore - b.matchScore);
                    const topMatches = matches.slice(0, 3);
                    const resultGrid = document.getElementById('quiz-match-grid');
                    resultGrid.innerHTML = '';
                    const medals = ['🥇', '🥈', '🥉'];

                    topMatches.forEach((dog, idx) => {
                        const card = document.createElement('div');
                        card.className = "bg-slate-800 rounded-2xl p-5 border border-slate-700 flex flex-col items-center text-center relative card-hover cursor-pointer";
                        card.onclick = () => app.openModal(dog.id);
                        
                        card.innerHTML = `
                            <div class="absolute -top-4 -left-4 text-4xl drop-shadow-lg">${medals[idx]}</div>
                            <div class="w-24 h-24 rounded-full overflow-hidden mb-3 mt-2 border-2 border-amber-400">
                                <img src="${dog.image}" alt="${dog.name}" class="w-full h-full object-cover">
                            </div>
                            <h3 class="text-xl font-bold text-white">${dog.name}</h3>
                            <span class="mt-2 px-3 py-1 text-xs font-semibold rounded-full bg-slate-700 text-amber-400">${dog.size}</span>
                            <p class="text-sm text-slate-400 mt-3 line-clamp-2">${dog.apt}</p>
                            <button class="mt-4 text-sm text-amber-500 font-medium">查看圖鑑 >></button>
                        `;
                        resultGrid.appendChild(card);
                    });

                    document.getElementById('quiz-questions').classList.add('hidden');
                    document.getElementById('submit-quiz-btn').classList.add('hidden');
                    document.getElementById('quiz-result').classList.remove('hidden');
                },

                resetQuiz: function() {
                    quizAnswers = { 1: 0, 2: 0, 3: 0 };
                    document.getElementById('submit-quiz-btn').disabled = true;
                    document.getElementById('submit-quiz-btn').classList.remove('hidden');
                    document.getElementById('quiz-questions').classList.remove('hidden');
                    document.getElementById('quiz-result').classList.add('hidden');
                    
                    const btns = document.querySelectorAll('[class^="quiz-ans-"]');
                    btns.forEach(btn => {
                        btn.classList.remove('border-amber-400', 'bg-slate-700', 'ring-2', 'ring-amber-500');
                        btn.classList.add('border-slate-600', 'bg-slate-700/50');
                    });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
